name: Offline quality validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: eai_demo
          POSTGRES_PASSWORD: eai_demo
          POSTGRES_DB: eai_quality
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U eai_demo -d eai_quality"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://eai_demo:eai_demo@127.0.0.1:55432/eai_quality
      ALLOW_OFFLINE_CI_MUTATIONS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run deterministic quality, browser, PostgreSQL, mutation and showcase checks
        run: npm run verify
      - name: Keep synthetic validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: offline-quality-${{ github.run_attempt }}
          path: |
            artifacts/quality.json
            artifacts/postgres-results.json
            artifacts/showcase-tests.json
            artifacts/ai-evaluation.json
            artifacts/mutation/
            playwright-report/
            test-results/
          retention-days: 7
