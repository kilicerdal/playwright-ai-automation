name: Quality Engineering
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm audit --audit-level=moderate
  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser, API, accessibility, security and AI guardrail suites
        run: npm test
      - name: Build authored AI examples and evidence report
        if: always()
        run: npm run ai:demo && npm run showcase:build
      - name: Verify interactive showcase
        if: success()
        run: npm run test:showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            artifacts/
            showcase/
          retention-days: 14
      - name: Job summary
        if: always()
        run: node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
