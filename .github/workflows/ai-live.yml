name: Live AI Evaluation
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model ID available to your OpenAI project
        required: true
        type: string
permissions:
  contents: read
jobs:
  ai:
    # A repository environment can enforce reviewer approval and spend controls.
    environment: ai-showcase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate live API-test candidates for review
        run: npm run ai:candidates:live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ inputs.model }}
      - run: npm run ai:live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ inputs.model }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-ai-evidence
          path: artifacts/
          retention-days: 7
